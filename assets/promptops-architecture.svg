<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PromptOps architecture diagram">
  <defs>
    <style>
      .box { fill: #F8FAFC; stroke: #CBD5F5; stroke-width: 2; }
      .title { font: 600 18px "Inter", "Segoe UI", sans-serif; fill: #0F172A; }
      .text { font: 400 14px "Inter", "Segoe UI", sans-serif; fill: #334155; }
      .accent { fill: #EEF2FF; stroke: #6366F1; }
      .line { stroke: #64748B; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#FFFFFF"/>

  <rect x="40" y="60" width="220" height="90" rx="12" class="box"/>
  <text x="150" y="95" text-anchor="middle" class="title">Clients</text>
  <text x="150" y="120" text-anchor="middle" class="text">CLI • UI • API Consumers</text>

  <rect x="320" y="40" width="250" height="130" rx="14" class="box accent"/>
  <text x="445" y="85" text-anchor="middle" class="title">REST API</text>
  <text x="445" y="110" text-anchor="middle" class="text">/api/chat • /api/command</text>
  <text x="445" y="132" text-anchor="middle" class="text">Swagger UI</text>

  <rect x="620" y="30" width="260" height="150" rx="14" class="box"/>
  <text x="750" y="75" text-anchor="middle" class="title">Reasoning Engine</text>
  <text x="750" y="100" text-anchor="middle" class="text">Intent routing</text>
  <text x="750" y="122" text-anchor="middle" class="text">Stateful sessions</text>
  <text x="750" y="144" text-anchor="middle" class="text">RAG orchestration</text>

  <rect x="920" y="40" width="240" height="90" rx="12" class="box"/>
  <text x="1040" y="80" text-anchor="middle" class="title">OpenAI</text>
  <text x="1040" y="105" text-anchor="middle" class="text">LLM responses</text>

  <rect x="320" y="230" width="260" height="120" rx="14" class="box"/>
  <text x="450" y="270" text-anchor="middle" class="title">Vector Store</text>
  <text x="450" y="295" text-anchor="middle" class="text">Chroma DB</text>
  <text x="450" y="318" text-anchor="middle" class="text">Similarity search</text>

  <rect x="40" y="230" width="220" height="120" rx="14" class="box"/>
  <text x="150" y="270" text-anchor="middle" class="title">Knowledge Base</text>
  <text x="150" y="295" text-anchor="middle" class="text">Markdown docs</text>
  <text x="150" y="318" text-anchor="middle" class="text">Token chunking</text>

  <rect x="620" y="230" width="260" height="120" rx="14" class="box"/>
  <text x="750" y="270" text-anchor="middle" class="title">AWS Tooling</text>
  <text x="750" y="295" text-anchor="middle" class="text">EC2 • S3 • CloudWatch</text>
  <text x="750" y="318" text-anchor="middle" class="text">Action execution</text>

  <rect x="920" y="230" width="240" height="120" rx="14" class="box"/>
  <text x="1040" y="270" text-anchor="middle" class="title">Command Studio</text>
  <text x="1040" y="295" text-anchor="middle" class="text">Generate + simulate</text>
  <text x="1040" y="318" text-anchor="middle" class="text">scripts/*.sh output</text>

  <line x1="260" y1="105" x2="320" y2="105" class="line"/>
  <line x1="570" y1="105" x2="620" y2="105" class="line"/>
  <line x1="880" y1="105" x2="920" y2="85" class="line"/>
  <line x1="450" y1="170" x2="450" y2="230" class="line"/>
  <line x1="150" y1="170" x2="150" y2="230" class="line"/>
  <line x1="750" y1="180" x2="750" y2="230" class="line"/>
  <line x1="1040" y1="170" x2="1040" y2="230" class="line"/>

  <text x="600" y="480" text-anchor="middle" class="text">PromptOps dataflow: client → API → reasoning → tools/RAG → response</text>
</svg>
